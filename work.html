<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Selected work from KABOVELO 360 — films, academy programs, fashion collections, community impact and marketing campaigns.">
    <title>Our Work | KABOVELO 360</title>
    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="./assets/js/layout.js"></script>
    <script src="./assets/js/data.js" defer></script>
    <script src="./assets/js/main.js" defer></script>
</head>
<body data-page="work" class="bg-obsidian text-greyLight font-sans selection:bg-armyGreenBright selection:text-obsidian antialiased overflow-x-hidden">

    <div id="pageLoader" role="status" aria-label="Loading">
        <div class="loader-mark"><div class="loader-ring"></div><div class="loader-ring inner"></div><div class="loader-core">360</div></div>
        <div class="loader-word">KABOVELO</div>
        <div class="loader-bar"></div>
    </div>

    <div id="siteHeader"></div>

    <main>
        <section class="relative flex items-center pt-32 pb-14 sm:pb-16 overflow-hidden">
            <div class="absolute inset-0">
                <img src="./assets/images/team/studio-lighting.jpg" alt="" class="w-full h-full object-cover opacity-30">
                <div class="absolute inset-0 bg-gradient-to-r from-obsidian via-obsidian/90 to-obsidian/50"></div>
                <div class="absolute inset-0 bg-[radial-gradient(#2E352F_1px,transparent_1px)] [background-size:32px_32px] opacity-20"></div>
            </div>
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 w-full">
                <div class="max-w-3xl">
                    <span class="text-xs font-bold uppercase tracking-widest text-armyGreenLight">Visual Portfolio</span>
                    <h1 class="font-serif text-4xl sm:text-6xl font-black tracking-tight text-white mt-3 mb-5 leading-tight">Our <span class="army-gradient-text">Work</span></h1>
                    <p class="max-w-2xl text-base sm:text-lg text-greyLight font-light leading-relaxed">Feature film sets, academy classrooms, runways, community programs and campaigns. Pick a division tab, then open any project for the full case study.</p>
                </div>
            </div>
        </section>

        <section class="pb-20 sm:pb-24 bg-obsidian">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-6 -mx-4 px-4 sm:mx-0 sm:px-0 lg:flex-wrap" id="workTabs"></div>
                <div id="workIntro" class="mb-6"></div>
                <div id="workGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 transition-opacity duration-200"></div>
            </div>
        </section>

        <section class="py-20 bg-gradient-to-r from-armyGreenDark via-tacticalBlack to-obsidian border-y border-charcoalBorder">
            <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center reveal">
                <span class="text-xs font-bold uppercase tracking-widest text-armyGreenLight">Your Project Next</span>
                <h2 class="font-serif text-3xl sm:text-5xl font-bold text-white mt-3 mb-5">Let’s make the next case study yours.</h2>
                <div class="flex flex-col sm:flex-row justify-center gap-4 mt-8">
                    <a href="./contact.html" class="px-8 py-4 rounded-full bg-gradient-to-r from-armyGreen via-armyGreenMedium to-armyGreenBright text-white font-bold text-xs uppercase tracking-widest shadow-xl hover:scale-105 transition-all border border-armyGreenLight/30">Start a Project</a>
                    <a href="./services.html" class="px-8 py-4 rounded-full glass-card hover:bg-white/10 text-white font-semibold text-xs uppercase tracking-widest border border-white/20">Browse Services</a>
                </div>
            </div>
        </section>
    </main>

    <div id="siteFooter"></div>
</body>
</html>
